name: fleet_console
description: Bytebeam Fleet Console — local-first Flutter take-home (DuckDB).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dart_duckdb: ^1.2.0
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^0.70.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  intl: ^0.20.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
